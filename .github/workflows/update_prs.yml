name: Update Profile README

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Fetch Open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch OPEN PRs authored by you
          open_prs=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/search/issues?q=is:pr+author:StancuFlorin+is:open&sort=created&order=desc&per_page=10")

          echo "$open_prs" > open_prs.json

      - name: Fetch Merged PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch MERGED PRs authored by you
          merged_prs=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/search/issues?q=is:pr+author:StancuFlorin+is:merged&sort=created&order=desc&per_page=10")

          echo "$merged_prs" > merged_prs.json

      - name: Combine Open and Merged PRs
        run: |
          # Combine both open and merged PRs and ensure valid objects with "created_at"
          jq -s '[.[][] | select(.created_at != null)] | sort_by(.created_at) | .[:10]' open_prs.json merged_prs.json > all_prs.json

      - name: Format PRs for README
        run: |
          echo "## 🚀 Recent Open Source Contributions" > pr_list.md
          echo "" >> pr_list.md

          # Add formatted PRs with emojis
          cat all_prs.json | jq -r '.[] |
            select(.repository_url | contains("StancuFlorin") | not) |
            "- " + (
              if .title | test("fix"; "i") then "🐛 Bug Fix: " 
              elif .title | test("add"; "i") then "🎉 Feature: " 
              else "🛠️ Update: " 
              end
            ) + "[\(.title)](\(.html_url)) - \(.repository_url | split("/") | last)"' >> pr_list.md

      - name: Update README
        run: |
          awk '/<!-- START PRS -->/{print; system("cat pr_list.md"); next} /<!-- END PRS -->/{found=1} {if(found) print}' README.md > README_tmp.md
          mv README_tmp.md README.md

      - name: Commit and Push Changes
        run: |
          git config --local user.email "your_email@example.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "🔄 Update README with latest PRs" || exit 0
          git push
