name: Update Profile README

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Git Config
        run: |
          git config --local user.email "your_email@example.com"
          git config --local user.name "GitHub Action"

      - name: Fetch Recent PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXCLUDED_REPOS=("StancuFlorin") # Add orgs/users to exclude
          
          # Fetch only OPEN and MERGED PRs (exclude closed PRs)
          prs=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/search/issues?q=is:pr+author:StancuFlorin+is:open&sort=created&order=desc&per_page=10")

          echo "## 🚀 Recent Open Source Contributions" > pr_list.md
          echo "" >> pr_list.md

          # Process PRs: Exclude unwanted repos & format with emojis
          echo "$prs" | jq -r '.items[] | select(.repository_url | contains("example-org") | not) | select(.repository_url | contains("bad-user") | not) |
          "- \(.title | if contains(\"fix\") then \"🐛 Bug Fix: \" else if contains(\"add\") then \"🎉 Feature: \" else \"🛠️ Update: \" end) [\(.title)](\(.html_url)) - \(.repository_url | split("/") | last)"' >> pr_list.md

      - name: Update README
        run: |
          awk '/<!-- START PRS -->/{print; system("cat pr_list.md"); next} /<!-- END PRS -->/{found=1} {if(found) print}' README.md > README_tmp.md
          mv README_tmp.md README.md

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add README.md
          git commit -m "🔄 Update README with latest PRs" || exit 0
          git push "https://${GITHUB_TOKEN}@github.com/StancuFlorin/StancuFlorin.git" main
